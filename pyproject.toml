[project]
name = "gfem"
version = "0.2.0"
description = "Differentiable finite-element electromagnetics, heat and mechanics for photonic, RF, microwave and superconducting quantum devices."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Benjamin Vial", email = "contact@bvial.info" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]
# Upper bound only where gfem touches internals (NGSolve). JAX gets a floor
# only: a cap would collide with optax / equinox in users' environments. The
# floor is the oldest JAX the unit tier passes on (CI's lowest job), low
# enough to share an environment with packages capping JAX below 0.10.
dependencies = [
  "contourpy>=1.3",
  "jax>=0.8.3",
  "meshio>=5.3.5",
  "ngsolve>=6.2.2608,<6.3",
  "numpy>=2.2",
  "scipy>=1.15",
]

[project.urls]
Homepage = "https://bvial.info/gfem/"
Documentation = "https://bvial.info/gfem/"
Source = "https://github.com/benvial/gfem"
Issues = "https://github.com/benvial/gfem/issues"

[project.scripts]
gfem = "gfem.__main__:main"

[project.optional-dependencies]
# cuDSS through nvmath-python. A no-op on macOS, so a shared requirements file
# still installs there. The two CUDA extras exclude each other.
cuda12 = [
  "nvmath-python[cu12]>=1.0,<1.1; (sys_platform == 'linux' and platform_machine == 'x86_64') or sys_platform == 'win32'",
]
cuda13 = [
  "nvmath-python[cu13]>=1.0,<1.1; (sys_platform == 'linux' and platform_machine == 'x86_64') or sys_platform == 'win32'",
]
# rich for the log display's lines and progress rows (`gfem.log.enable`); without
# it the display falls back to plain text.
log = ["rich>=14.2"]
# MKL PARDISO with METIS ordering for the CPU direct solver. Proprietary: `mkl`
# is under the Intel Simplified Software License, and the `intel-openmp` and
# `intel-cmplr-lib-ur` it pulls in under the Intel End User License Agreement
# for Developer Tools (no SaaS or service-bureau use; see
# docs/project/licence.md). Wheels exist for x86_64 Linux and Windows only;
# elsewhere the extra installs nothing and `direct` stays sparse Cholesky.
mkl = [
  "mkl>=2026.2; (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
]
# mpi4py for distributed solves. Brings no MPI library: load Open MPI's module or
# package, the only MPI that gives right numbers with NGSolve's wheel. Linux x86_64
# only, like the MPI PETSc stack. Capped: NGSolve's wrapper reaches into mpi4py.
mpi = [
  "mpi4py>=4.1.2,<5; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# SAX, to place solves in SAX circuits. gfem never imports it: a component
# returns a plain dictionary. Floored at the last SAX that does not cap JAX
# below 0.10, so the lock keeps the newest JAX.
sax = ["sax>=0.16.14"]
# scikit-rf, for the S-parameter export. Floored at SAX's own floor; uncapped,
# as gfem uses only its public constructor.
skrf = ["scikit-rf>=1.8"]
viz = ["pyvista"]
xarray = ["xarray>=2024.10"]

[dependency-groups]
dev = [{ include-group = "lint" }, { include-group = "test" }]
# Running the tutorial notebooks (docs/tutorials): an external optimizer, plots,
# 3D views and a headless notebook runner.
docs = [
  "ipykernel>=6.29",
  "matplotlib>=3.9",
  "nbconvert>=7.16",
  "optax>=0.2.4",
  "pyvista>=0.44",
]
lint = ["ruff>=0.14", "ty==0.0.85"]
# Test only, never shipped or in a default group: the circuit simulators that
# run the exported netlists (tests marked `netlist`, skipped without them).
# sedes (MIT) bundles ngspice 45 with OSDI; vacask-bin (GPL-3.0/AGPL-3.0,
# about 94 MB) bundles the openvaf-r Verilog-A compiler and VACASK. Exact
# pins: vacask-bin is a pre-release.
netlist = ["sedes==0.1.10", "vacask-bin==0.3.4.dev7"]
# Building the docs site (docs/conf.py), on top of `docs`. Python >= 3.13 only
# ([tool.uv.dependency-groups] below): Sphinx 9.2 does not support 3.12.
site = [
  "myst-nb~=1.4",
  "myst-parser~=5.1",
  "pagefind[bin]==1.5.2",
  "shibuya==2026.7.12",
  "sphinx~=9.2.0",
  "sphinx-autoapi~=3.8",
  "sphinx-copybutton==0.5.2",
  "sphinxext-opengraph",
  # The tutorials' 3D scenes: exported by `just notebooks` (trame-pyvista),
  # opened on the site by trame-vtk's offline vtk.js viewer.
  "trame-pyvista",
  "trame-vtk",
]
test = ["gdstk>=0.9.61", "gfem[sax,skrf]", "pytest>=8.3", "pytest-cov>=6.0", "rich>=14.2", "xarray>=2024.10"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
# Test tiers are markers. tests/conftest.py marks every test by its directory
# (tests/unit -> unit, tests/verification -> verification, ...). The heavy and
# GPU tiers are opt-in, e.g. `pytest -m reference`. importlib mode lets
# tiers share test file names (tests/unit/test_x.py, tests/verification/test_x.py).
addopts = "--tb=short --strict-markers --import-mode=importlib -m 'not reference and not benchmark and not cuda and not mpi'"
markers = [
  "unit: fast tests run on every PR on all platforms (tests/unit)",
  "verification: convergence, manufactured-solution and Taylor tests (tests/verification)",
  "reference: MN5-scale checks, some against frozen baselines (GFEM_REFERENCE_DIR) (tests/reference, deselected by default)",
  "benchmark: wall-time and memory regression runs (tests/benchmark, deselected by default)",
  "cuda: needs an NVIDIA GPU and the cuda12 or cuda13 extra (tests/cuda, deselected by default)",
  "mpi: launched under ranks from a one-process pytest, needs mpi4py and Open MPI; skipped without them (tests/mpi, deselected by default)",
  "petsc: needs complex petsc4py built as the PETSc and SLEPc recipe describes; skipped without it (run alone with -m petsc)",
  "slepc: needs slepc4py on that PETSc; skipped without it",
  "netlist: runs the exported netlists in ngspice and VACASK; needs the netlist group (uv sync --group netlist), skipped without it",
  "slow: recorded at 30 s or more in tests/durations.json, or marked by hand; push and pull-request CI runs leave it out",
  "bitwise: needs repeatable direct solves (last bits, tight convergence); one solve thread without PARDISO",
]
pythonpath = ["tools", "tests", "."]  # "." imports the benchmarks package
testpaths = ["tests"]

[tool.ruff]
fix = true
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]  # see https://docs.astral.sh/ruff/rules; the ignore list starts from gsim's
ignore = [
  "ANN",  # flake8-annotations (too noisy for evolving API)
  "C408",  # unnecessary-collection-call
  "C901",  # complex-structure
  "COM812",  # missing-trailing-comma (conflicts with the formatter)
  "CPY001",  # missing-copyright-notice (LICENSE covers the repository)
  "D105",  # undocumented-magic-method
  "D417",  # undocumented-param (google convention is strict here)
  "E741",  # ambiguous-variable-name
  "EM101",  # exception-must-not-use-string-literal
  "EM102",  # exception-must-not-use-f-string-literal
  "FBT",  # boolean-trap
  "FIX002",  # line-contains-todo
  "N803",  # invalid-argument-name (physics names: E, H, Z0, ...)
  "N806",  # non-lowercase-variable-in-function (physics names)
  "PLC0415",  # import-outside-top-level (lazy imports of heavy dependencies)
  "PLR0913",  # too-many-arguments
  "PLR2004",  # magic-value-comparison
  "RET504",  # unnecessary-assign
  "TC001",  # typing-only-first-party-import
  "TC002",  # typing-only-third-party-import
  "TC003",  # typing-only-standard-library-import
  "TD002",  # missing-todo-author
  "TD003",  # missing-todo-link
  "TRY003",  # raise-vanilla-args
]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"docs/**/*.ipynb" = [
  "D",  # pydocstyle (tutorial helpers are explained in the prose)
  "T201",  # print (notebooks report results)
]
"tests/**/*.py" = [
  "D",  # pydocstyle
  "INP001",  # implicit-namespace-package
  "PT011",  # pytest-raises-too-broad
  "S101",  # assert
  "S603",  # subprocess-without-shell-equals-true
  "SLF001",  # private-member-access
]
"docs/**/*.py" = [
  "INP001",  # implicit-namespace-package (Sphinx configuration, not a package)
]
"tools/{*,stacks/*}.py" = [
  "INP001",  # implicit-namespace-package (scripts, not a package)
  "S603",  # subprocess-without-shell-equals-true
  "T201",  # print
]
"benchmarks/**/*.py" = [
  "S603",  # subprocess-without-shell-equals-true (launches sbatch, srun, workers)
  "S607",  # start-process-with-partial-path (sbatch, srun, rsync, git from PATH)
  "T201",  # print (a command line)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.src]
include = ["src", "benchmarks"]

[tool.ty.analysis]
# The cuda12 / cuda13 extras: absent from the default environment.
allowed-unresolved-imports = ["nvmath.**", "cuda.**", "petsc4py.**", "slepc4py.**", "mpi4py.**"]

[tool.uv]
# The supported platforms: jaxlib has no Intel macOS wheel and
# ngsolve has no Linux aarch64 wheel.
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
conflicts = [[{ extra = "cuda12" }, { extra = "cuda13" }]]

[tool.uv.dependency-groups]
site = { requires-python = ">=3.13" }
