name: CI
# Every push and pull request runs the fast jobs. The slow ones (verification,
# the tutorial notebooks: hours on a runner) run nightly and on demand
# (`gh workflow run CI --ref main`); release.yml publishes a tag only after a run
# of all of them passed on its commit. Push and pull-request runs also leave out
# the tests marked `slow` (30 s or more in tests/durations.json), and run only
# the test jobs their changed paths need (the `changes` job).
on:
  pull_request:
  push:
    branches:
    - main
  schedule:
  # nightly, 02:17 UTC: the slow jobs, and licence changes in new dependency releases
  - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      # Set `tests` to run only those tests in one job, nothing else:
      #   gh workflow run CI --ref BRANCH -f tests="tests/unit/test_x.py::test_y" -f os=macos-latest
      tests:
        description: "pytest arguments for one targeted job (empty: the full run)"
        default: ""
      os:
        description: "the targeted job's runner"
        default: ubuntu-latest
        type: choice
        options: [ubuntu-latest, macos-latest, windows-latest]
      python:
        description: "the targeted job's Python"
        default: "3.12"
      extras:
        description: "the targeted job's uv sync flags, e.g. --extra mkl"
        default: "--extra viz"
permissions:
  contents: read
concurrency:
  # a push cancels the push run before it, never a nightly, on-demand or
  # targeted run; a targeted run cancels only one for the same tests
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.tests }}
  cancel-in-progress: true
env:
  UV_VERSION: "0.13.1"
  # nightly and on-demand runs: every test, and junit timings uploaded as
  # durations-* artifacts, which tools/test_durations.py folds into
  # tests/durations.json (the shard balance and the `slow` marker)
  FULL_RUN: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
  UNIT_MARK: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'unit' || 'unit and not slow' }}
jobs:
  changes:
    # Which test jobs this push or pull request needs (tools/ci_scope.py): none
    # for the whitepaper and Markdown no test reads; only the unit tier on one
    # runner for docs/ and README.md, which unit tests read (recipes, pages);
    # every job otherwise. A push is compared with the last push whose CI run
    # passed on its branch, not the push before it: that one's run may have been
    # cancelled or failed. Scheduled and on-demand runs, and a diff that cannot
    # be computed (no passed run yet, a force push), take every job.
    name: change scope
    if: inputs.tests == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # the last passed push run
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Scope
      id: scope
      env:
        EVENT: ${{ github.event_name }}
        BRANCH: ${{ github.ref_name }}
        SHA: ${{ github.sha }}
        GH_TOKEN: ${{ github.token }}
      # pull_request checks out the merge commit: its first parent is the base.
      # --no-renames lists both sides of a move, so code moved under docs/ is
      # still a code change.
      run: |
        case "$EVENT" in
          push)
            from=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --branch "$BRANCH" \
              --event push --status success --limit 1 --json headSha --jq '.[0].headSha // empty' || true)
            to=$SHA ;;
          pull_request) from=HEAD^1 to=HEAD ;;
          *) from= to= ;;
        esac
        scope=scope=full
        if [ -n "$from" ] && paths=$(git diff --no-renames --name-only "$from" "$to"); then
          scope=$(printf '%s\n' "$paths" | python3 tools/ci_scope.py) || scope=scope=full
        fi
        echo "$scope" | tee -a "$GITHUB_OUTPUT"

  test:
    name: unit (${{ matrix.os }}, py${{ matrix.python }})
    needs: changes
    # Not skipped at job level, so the required checks carrying these names
    # report on every run: a scope that does not need this entry gates its
    # steps instead. A failed scope job leaves the scope empty: every step runs.
    if: ${{ !cancelled() && inputs.tests == '' }}
    runs-on: ${{ matrix.os }}
    env:
      RUN_TIER: ${{ needs.changes.outputs.scope != 'none' && (needs.changes.outputs.scope != 'docs' || (matrix.os == 'ubuntu-latest' && matrix.python == '3.12')) }}
      # a docs change runs the slow tests too: most of them check the recipes
      TEST_MARK: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.scope == 'docs') && 'unit' || 'unit and not slow' }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64; Intel macOS is unsupported (no jaxlib wheel).
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.14"]
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v6
      if: env.RUN_TIER == 'true'
      with:
        version: ${{ env.UV_VERSION }}
        python-version: ${{ matrix.python }}
        enable-cache: true
    - name: System libraries for gmsh
      if: runner.os == 'Linux' && env.RUN_TIER == 'true'
      # The PyPI gmsh wheel loads OpenGL and X11 libraries at import.
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglu1-mesa libxcursor1 libxft2 libxinerama1 libgl1 libgomp1
    - name: Install
      if: env.RUN_TIER == 'true'
      # viz: Field.to_pyvista is unit-tested (no rendering, no display needed)
      run: uv sync --locked --extra viz
    - name: Ruff
      if: env.RUN_TIER == 'true'
      run: uv run ruff check --no-fix .
    - name: Ruff format
      if: env.RUN_TIER == 'true'
      run: uv run ruff format --check .
    - name: ty
      # Once, on Linux: the `ty: ignore`s match Linux's ngsolve stubs, which the
      # macOS and Windows wheels do not share.
      if: env.RUN_TIER == 'true' && matrix.os == 'ubuntu-latest'
      run: uv run ty check src benchmarks
    - name: Unit tier
      if: env.RUN_TIER == 'true'
      run: uv run pytest -m "${{ env.TEST_MARK }}" --junitxml=junit-unit.xml
    - name: Durations
      if: always() && env.RUN_TIER == 'true' && env.FULL_RUN == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: durations-unit-${{ matrix.os }}-py${{ matrix.python }}
        path: junit-unit.xml
        if-no-files-found: ignore
        retention-days: 14

  verification:
    # Serial, the tier takes over 3 h on one runner: split into shards balanced
    # by the recorded test durations (conftest.py's --shard, tests/durations.json),
    # with and without MKL.
    name: verification (ubuntu, py3.12${{ matrix.extra && ', mkl' || '' }}, shard ${{ matrix.shard }}/8)
    if: inputs.tests == '' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: ["", mkl]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v6
      with:
        version: ${{ env.UV_VERSION }}
        python-version: "3.12"
        enable-cache: true
        cache-suffix: ${{ matrix.extra }}
    - name: System libraries for gmsh
      # The PyPI gmsh wheel loads OpenGL and X11 libraries at import.
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglu1-mesa libxcursor1 libxft2 libxinerama1 libgl1 libgomp1
    - name: Install
      run: uv sync --locked ${{ matrix.extra && '--extra mkl' || '' }}
    - name: MKL is live
      if: matrix.extra == 'mkl'
      run: >-
        uv run python -c "from gfem._linalg import pardiso;
        assert pardiso.pardiso_available(), 'MKL PARDISO not found'"
    - name: Verification tier
      run: uv run pytest -m verification -rs --shard ${{ matrix.shard }}/8 --junitxml=junit-verification.xml
    - name: Durations
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: durations-verification${{ matrix.extra && '-mkl' || '' }}-${{ matrix.shard }}
        path: junit-verification.xml
        if-no-files-found: ignore
        retention-days: 14

  mkl:
    # The mkl extra: MKL PARDISO (the direct backend, BDDC's coarse problem).
    # The mkl wheel exists for Linux x86_64 and Windows AMD64 only (PyPI), so
    # no macOS entry: there the extra installs nothing.
    # (its verification tier runs in the verification job)
    name: unit (${{ matrix.os }}, py3.12, mkl)
    needs: changes
    if: ${{ !cancelled() && inputs.tests == '' && needs.changes.outputs.scope != 'none' && needs.changes.outputs.scope != 'docs' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v6
      with:
        version: ${{ env.UV_VERSION }}
        python-version: "3.12"
        enable-cache: true
        # its own cache: the unit job's key has no mkl wheels (setup-uv README)
        cache-suffix: mkl
    - name: System libraries for gmsh
      if: runner.os == 'Linux'
      # The PyPI gmsh wheel loads OpenGL and X11 libraries at import.
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglu1-mesa libxcursor1 libxft2 libxinerama1 libgl1 libgomp1
    - name: Install
      run: uv sync --locked --extra viz --extra mkl
    - name: MKL is live
      # The needs_mkl tests skip without the mkl distribution: fail here
      # instead of passing on skips.
      # (`import mkl` is mkl-service, not this wheel.)
      run: >-
        uv run python -c "import importlib.metadata as md;
        from gfem._linalg import pardiso;
        assert pardiso.pardiso_available(), 'MKL PARDISO not found';
        print('mkl', md.version('mkl'), ': PARDISO live')"
    - name: MKL tests
      run: uv run pytest -v -rs tests/unit/test_linalg_mkl.py
    - name: Unit tier
      run: uv run pytest -m "${{ env.UNIT_MARK }}" -rs

  netlist:
    # The netlist group: the exported SPICE and Verilog-A models run in ngspice
    # (sedes) and VACASK, Verilog-A compiled by openvaf-r (vacask-bin). Test
    # only; elsewhere the netlist tests skip.
    name: netlists in circuit simulators (ubuntu, py3.12)
    needs: changes
    if: ${{ !cancelled() && inputs.tests == '' && needs.changes.outputs.scope != 'none' && needs.changes.outputs.scope != 'docs' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v6
      with:
        version: ${{ env.UV_VERSION }}
        python-version: "3.12"
        enable-cache: true
        # its own cache: the unit job's key has no simulator wheels
        cache-suffix: netlist
    - name: System libraries for gmsh
      # The PyPI gmsh wheel loads OpenGL and X11 libraries at import.
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglu1-mesa libxcursor1 libxft2 libxinerama1 libgl1 libgomp1
    - name: Install
      run: uv sync --locked --group netlist
    - name: Simulators are live
      # The netlist tests skip without the simulators: fail here instead of
      # passing on skips.
      run: >-
        uv run --group netlist python -c "import subprocess, sedes, vacask_bin;
        import importlib.metadata as md;
        subprocess.run([vacask_bin.OPENVAF_CMD, '--version'], check=True);
        subprocess.run([vacask_bin.VACASK_CMD, '--help'], check=True,
        stdout=subprocess.DEVNULL);
        print('sedes', md.version('sedes'), ', vacask-bin', md.version('vacask-bin'))"
    - name: Netlist tests
      run: uv run --group netlist pytest -m netlist -rs

  mpi:
    # The launched tier on the wheel's BDDC, at most 4 ranks on a runner's 4 cores,
    # and Open MPI's refusal of another MPI. Direct solves under ranks need the MPI
    # PETSc stack, whose cold build is too long for every pull request: petsc.yml.
    # Pinned, not ubuntu-latest: apt's Open MPI 4.1.6 is MareNostrum 5's version.
    name: launched tests (ubuntu-24.04, py3.12, Open MPI)
    needs: changes
    if: ${{ !cancelled() && inputs.tests == '' && needs.changes.outputs.scope != 'none' && needs.changes.outputs.scope != 'docs' }}
    # The tier took 53 min on 8 cores, on Open MPI 5.0.11: a liveness bound, no gate.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GFEM_TEST_MPI_MAX_RANKS: "4"
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v6
      with:
        version: ${{ env.UV_VERSION }}
        python-version: "3.12"
        enable-cache: true
        cache-suffix: mpi
    - name: Open MPI and the system libraries for gmsh
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openmpi-bin libopenmpi-dev libglu1-mesa libxcursor1 libxft2 libxinerama1 libgl1 libgomp1
    - name: Install
      run: uv sync --locked --extra mpi
    - name: MPI is usable
      # Fail rather than skip every launched test.
      run: >-
        mpirun -n 2 --oversubscribe .venv/bin/python -c "from mpi4py import MPI;
        size, vendor = MPI.COMM_WORLD.size, MPI.get_vendor();
        assert size == 2 and vendor[0] == 'Open MPI', (size, vendor);
        print(vendor)"
    - name: Unit tier
      run: uv run pytest -m "${{ env.UNIT_MARK }}"
    - name: Launched tier
      # Without the MPI PETSc stack its cases skip, and BDDC's coarse is on rank 0.
      run: uv run pytest -m "mpi and not reference" -rs
    - name: Another MPI is refused
      # A throwaway environment: PyPI's mpich is no dependency of gfem's, and the
      # licence gate never sees it. The wheel's UCX would try an Azure RDMA
      # device (mana_0) some runners carry and hang in MPI_Init; both ranks
      # share one host, so shared memory and TCP are enough.
      timeout-minutes: 5
      env:
        UCX_TLS: self,sm,tcp
      run: |
        uv venv .venv-mpich --python 3.12
        uv pip install --python .venv-mpich ".[mpi]" mpich==5.0.2
        .venv-mpich/bin/mpiexec -n 2 .venv-mpich/bin/python tools/mpi_refusal.py

  tutorials:
    name: tutorial notebooks (ubuntu, py3.13)
    if: inputs.tests == '' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v6
      with:
        version: ${{ env.UV_VERSION }}
        python-version: "3.13"
        enable-cache: true
    - name: Install
      # as `just notebooks`: the docs profile exports 3D scenes through the site
      # group's trame (Python >= 3.13)
      run: uv sync --locked --group docs --group site
    - name: Headless OpenGL
      # PyVista renders through EGL on Mesa's software rasteriser (no display,
      # and OSMesa is gone from recent Mesa).
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri
    - name: Execute every tutorial end to end
      env:
        JAX_PLATFORMS: cpu
        VTK_DEFAULT_OPENGL_WINDOW: vtkEGLRenderWindow
        # the docs IPython profile, as `just notebooks`: gfem's colormaps and scenes
        IPYTHONDIR: ${{ github.workspace }}/docs/_ipython
      run: >-
        uv run --group docs --group site jupyter nbconvert --to notebook --execute
        --ExecutePreprocessor.timeout=1800 --output-dir "$RUNNER_TEMP"
        docs/tutorials/*.ipynb
    - name: No card script failed
      # The docs startup hook runs each tutorial's card script after its tagged
      # cell and, on an error, only writes "gfem still <name> failed" to the
      # cell's stderr, so the execution above stays green: fail on that text.
      run: |
        if grep -l "gfem still .* failed" "$RUNNER_TEMP"/*.ipynb; then
          echo "a card script failed in the notebooks listed above" >&2
          exit 1
        fi

  lowest:
    # The floors pyproject.toml declares (JAX's, NumPy's...): the lock carries
    # the newest, so without this job nothing checks them.
    name: unit, lowest direct dependencies (ubuntu, py3.12)
    needs: changes
    if: ${{ !cancelled() && inputs.tests == '' && needs.changes.outputs.scope != 'none' && needs.changes.outputs.scope != 'docs' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v6
      with:
        version: ${{ env.UV_VERSION }}
        python-version: "3.12"
    - name: System libraries for gmsh
      # The PyPI gmsh wheel loads OpenGL and X11 libraries at import.
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglu1-mesa libxcursor1 libxft2 libxinerama1 libgl1 libgomp1
    - name: Install
      # Resolving lowest rewrites uv.lock; put it back, as tests read the lock.
      run: |
        uv sync --resolution lowest-direct
        git checkout -- uv.lock
    - name: Unit tier
      run: uv run --no-sync pytest -m "${{ env.UNIT_MARK }}"

  sax-newest:
    # pip resolves gfem[sax] to the newest SAX, which caps JAX below 0.10; the
    # lock and the lowest job never see that pair. Runs the tests that touch
    # SAX or scikit-rf: add each new one to the list.
    name: unit, newest SAX as pip resolves it (ubuntu, py3.12)
    needs: changes
    if: ${{ !cancelled() && inputs.tests == '' && needs.changes.outputs.scope != 'none' && needs.changes.outputs.scope != 'docs' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v6
      with:
        version: ${{ env.UV_VERSION }}
        python-version: "3.12"
    - name: Install
      run: |
        uv venv .venv-sax --python 3.12
        uv pip install --python .venv-sax ".[sax,skrf]" "sax>=0.17" pytest
    - name: SAX is live
      run: >-
        .venv-sax/bin/python -c "import importlib.metadata as md, sax, klujax, skrf;
        print({p: md.version(p) for p in ('sax', 'klujax', 'jax', 'scikit-rf')})"
    - name: SAX unit tests
      run: >-
        .venv-sax/bin/python -m pytest -rs tests/unit/test_import.py
        tests/unit/test_to_sdict.py tests/unit/test_to_skrf.py
        tests/unit/test_sax_component.py tests/unit/test_sax_circuits.py
        tests/unit/test_docs_sax_recipe.py

  build:
    name: build wheel and sdist
    if: inputs.tests == ''
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v6
      with:
        version: ${{ env.UV_VERSION }}
        python-version: "3.12"
    - name: Build
      # The licence-gate jobs check the wheel itself (tag, no native files, LICENSE).
      run: |
        uv build
        ls dist/gfem-*-py3-none-any.whl dist/gfem-*.tar.gz
    - uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  licence-gate:
    name: licence gate (${{ matrix.os }}, py${{ matrix.python }}, ${{ matrix.extra || 'base' }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.14"]
        extra: [""]
        include:
        # CUDA extras exist only on Linux x86_64 and Windows (no-op on macOS).
        - {os: ubuntu-latest, python: "3.12", extra: cuda12}
        - {os: ubuntu-latest, python: "3.12", extra: cuda13}
        - {os: windows-latest, python: "3.12", extra: cuda12}
        - {os: windows-latest, python: "3.12", extra: cuda13}
        # On macOS the extra installs nothing and a GPU request says so.
        - {os: macos-latest, python: "3.12", extra: cuda12}
        # MKL wheels exist only for Linux x86_64 and Windows (no-op on macOS).
        - {os: ubuntu-latest, python: "3.12", extra: mkl}
        - {os: windows-latest, python: "3.12", extra: mkl}
        - {os: macos-latest, python: "3.12", extra: mkl}
        # The MPI extra is Linux x86_64 only (no-op on macOS).
        - {os: ubuntu-latest, python: "3.12", extra: mpi}
        - {os: macos-latest, python: "3.12", extra: mpi}
        # klujax, which SAX pulls in, is native on all three.
        - {os: ubuntu-latest, python: "3.12", extra: sax}
        - {os: macos-latest, python: "3.12", extra: sax}
        - {os: windows-latest, python: "3.12", extra: sax}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v6
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    - uses: astral-sh/setup-uv@v6
      with:
        version: ${{ env.UV_VERSION }}
    - name: Install the built wheel into a fresh venv
      run: |
        uv venv .venv-gate --python "${{ matrix.python }}"
        wheel=$(ls dist/*.whl)
        if [ -n "${{ matrix.extra }}" ]; then wheel="${wheel}[${{ matrix.extra }}]"; fi
        uv pip install --python .venv-gate "$wheel"
    - name: Import gfem
      run: |
        py=.venv-gate/bin/python; [ -x "$py" ] || py=.venv-gate/Scripts/python.exe
        "$py" -I -c "import gfem, jax.numpy as jnp; print(gfem.__version__, jnp.asarray(1.0).dtype)"
    - name: No-GPU contract
      # Hosted runners have no GPU: device="cuda" must raise, never fall back.
      if: startsWith(matrix.extra, 'cuda')
      run: |
        py=.venv-gate/bin/python; [ -x "$py" ] || py=.venv-gate/Scripts/python.exe
        "$py" -I -c "
        import sys, gfem
        from gfem import _cuda
        assert not gfem.cuda_available()
        try:
            _cuda.require('cuda')
        except gfem.DeviceUnavailableError as err:
            print(err)
            expect = 'not supported on macOS' if sys.platform == 'darwin' else 'CUDA'
            assert expect in str(err), err
        else:
            raise AssertionError('device=cuda did not raise')
        "
    - name: Licence gate
      run: |
        py=.venv-gate/bin/python; [ -x "$py" ] || py=.venv-gate/Scripts/python.exe
        "$py" -I tools/licence_gate.py --wheel dist/*.whl

  wheel-smoke:
    # The built wheel solves: electrostatic with its gradient, driven and
    # eigenmode against closed forms (tools/wheel_smoke.py), from a fresh
    # venv with no lockfile. Not -I: the script imports its helper
    # structured_meshes from tools/.
    name: wheel smoke (${{ matrix.os }}, py${{ matrix.python }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.14"]
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v6
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    - uses: astral-sh/setup-uv@v6
      with:
        version: ${{ env.UV_VERSION }}
    - name: Install the built wheel into a fresh venv
      run: |
        uv venv .venv-smoke --python "${{ matrix.python }}"
        uv pip install --python .venv-smoke dist/*.whl
    - name: Smoke solve
      run: |
        py=.venv-smoke/bin/python; [ -x "$py" ] || py=.venv-smoke/Scripts/python.exe
        "$py" -E -s tools/wheel_smoke.py

  targeted:
    name: targeted (${{ inputs.os }}, py${{ inputs.python }})
    if: inputs.tests != ''
    runs-on: ${{ inputs.os }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v6
      with:
        version: ${{ env.UV_VERSION }}
        python-version: ${{ inputs.python }}
        enable-cache: true
    - name: System libraries for gmsh
      if: runner.os == 'Linux'
      # The PyPI gmsh wheel loads OpenGL and X11 libraries at import.
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglu1-mesa libxcursor1 libxft2 libxinerama1 libgl1 libgomp1
    - name: Install
      env:
        EXTRAS: ${{ inputs.extras }}
      run: uv sync --locked $EXTRAS
    - name: The named tests
      env:
        TESTS: ${{ inputs.tests }}
      # no -m: the named tests run whatever their tier
      run: uv run pytest -rs -m "" $TESTS
