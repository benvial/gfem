name: CI
on:
  pull_request:
  push:
    branches:
    - main
  schedule:
  - cron: "0 4 * * 1"  # weekly: catches licence changes in new dependency releases
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  UV_VERSION: "0.13.1"
jobs:
  test:
    name: unit (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64; Intel macOS is unsupported (no jaxlib wheel).
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.14"]
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v6
      with:
        version: ${{ env.UV_VERSION }}
        python-version: ${{ matrix.python }}
        enable-cache: true
    - name: Install
      # viz: Field.to_pyvista is unit-tested (no rendering, no display needed)
      run: uv sync --locked --extra viz
    - name: Ruff
      run: uv run ruff check --no-fix .
    - name: Ruff format
      run: uv run ruff format --check .
    - name: ty
      # Once, on Linux: the `ty: ignore`s match Linux's ngsolve stubs, which the
      # macOS and Windows wheels do not share.
      if: matrix.os == 'ubuntu-latest'
      run: uv run ty check src
    - name: Unit tier
      run: uv run pytest -m unit

  verification:
    name: verification (ubuntu, py3.12)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v6
      with:
        version: ${{ env.UV_VERSION }}
        python-version: "3.12"
        enable-cache: true
    - name: Install
      run: uv sync --locked
    - name: Verification tier
      run: uv run pytest -m verification

  mkl:
    # The mkl extra: MKL PARDISO (the direct backend, BDDC's coarse problem) and
    # MKL's BLAS for GMRES. The mkl wheel exists for Linux x86_64 and Windows
    # AMD64 only (PyPI), so no macOS entry: there the extra installs nothing.
    name: ${{ matrix.tier }} (${{ matrix.os }}, py3.12, mkl)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - {os: ubuntu-latest, tier: unit}
        - {os: windows-latest, tier: unit}
        - {os: ubuntu-latest, tier: verification}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v6
      with:
        version: ${{ env.UV_VERSION }}
        python-version: "3.12"
        enable-cache: true
        # its own cache: the unit job's key has no mkl wheels (setup-uv README)
        cache-suffix: mkl
    - name: Install
      run: uv sync --locked --extra viz --extra mkl
    - name: MKL is live
      # The needs_mkl tests skip without the mkl distribution and the GMRES MKL
      # tests without MKL's BLAS: fail here instead of passing on skips.
      # (`import mkl` is mkl-service, not this wheel.)
      run: >-
        uv run python -c "import importlib.metadata as md;
        from gfem._linalg import gmres, pardiso;
        assert pardiso.pardiso_available(), 'MKL PARDISO not found';
        assert gmres.mkl_blas() is not None, 'MKL BLAS not found';
        print('mkl', md.version('mkl'), ': PARDISO and BLAS live')"
    - name: MKL tests
      if: matrix.tier == 'unit'
      run: uv run pytest -v -rs tests/unit/test_linalg_mkl.py tests/unit/test_gmres.py
    - name: ${{ matrix.tier }} tier
      run: uv run pytest -m ${{ matrix.tier }} -rs

  tutorials:
    name: tutorial notebooks (ubuntu, py3.12)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v6
      with:
        version: ${{ env.UV_VERSION }}
        python-version: "3.12"
        enable-cache: true
    - name: Install
      run: uv sync --locked --group docs
    - name: Headless OpenGL
      # PyVista renders through EGL on Mesa's software rasteriser (no display,
      # and OSMesa is gone from recent Mesa).
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri
    - name: Execute every tutorial end to end
      env:
        JAX_PLATFORMS: cpu
        VTK_DEFAULT_OPENGL_WINDOW: vtkEGLRenderWindow
      run: >-
        uv run --group docs jupyter nbconvert --to notebook --execute
        --ExecutePreprocessor.timeout=1800 --output-dir "$RUNNER_TEMP"
        docs/tutorials/*.ipynb

  lowest:
    name: unit, lowest direct dependencies (ubuntu, py3.12)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v6
      with:
        version: ${{ env.UV_VERSION }}
        python-version: "3.12"
    - name: Install
      run: uv sync --resolution lowest-direct
    - name: Unit tier
      run: uv run pytest -m unit

  build:
    name: build wheel and sdist
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v6
      with:
        version: ${{ env.UV_VERSION }}
        python-version: "3.12"
    - name: Build
      # The licence-gate jobs check the wheel itself (tag, no native files, LICENSE).
      run: |
        uv build
        ls dist/gfem-*-py3-none-any.whl dist/gfem-*.tar.gz
    - uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  licence-gate:
    name: licence gate (${{ matrix.os }}, py${{ matrix.python }}, ${{ matrix.extra || 'base' }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.14"]
        extra: [""]
        include:
        # CUDA extras exist only on Linux x86_64 and Windows (no-op on macOS).
        - {os: ubuntu-latest, python: "3.12", extra: cuda12}
        - {os: ubuntu-latest, python: "3.12", extra: cuda13}
        - {os: windows-latest, python: "3.12", extra: cuda12}
        - {os: windows-latest, python: "3.12", extra: cuda13}
        # On macOS the extra installs nothing and a GPU request says so.
        - {os: macos-latest, python: "3.12", extra: cuda12}
        # MKL wheels exist only for Linux x86_64 and Windows (no-op on macOS).
        - {os: ubuntu-latest, python: "3.12", extra: mkl}
        - {os: windows-latest, python: "3.12", extra: mkl}
        - {os: macos-latest, python: "3.12", extra: mkl}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v6
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    - uses: astral-sh/setup-uv@v6
      with:
        version: ${{ env.UV_VERSION }}
    - name: Install the built wheel into a fresh venv
      run: |
        uv venv .venv-gate --python "${{ matrix.python }}"
        wheel=$(ls dist/*.whl)
        if [ -n "${{ matrix.extra }}" ]; then wheel="${wheel}[${{ matrix.extra }}]"; fi
        uv pip install --python .venv-gate "$wheel"
    - name: Import gfem
      run: |
        py=.venv-gate/bin/python; [ -x "$py" ] || py=.venv-gate/Scripts/python.exe
        "$py" -I -c "import gfem, jax.numpy as jnp; print(gfem.__version__, jnp.asarray(1.0).dtype)"
    - name: No-GPU contract
      # Hosted runners have no GPU: device="cuda" must raise, never fall back.
      if: startsWith(matrix.extra, 'cuda')
      run: |
        py=.venv-gate/bin/python; [ -x "$py" ] || py=.venv-gate/Scripts/python.exe
        "$py" -I -c "
        import sys, gfem
        from gfem import _cuda
        assert not gfem.cuda_available()
        try:
            _cuda.require('cuda')
        except gfem.DeviceUnavailableError as err:
            print(err)
            expect = 'not supported on macOS' if sys.platform == 'darwin' else 'CUDA'
            assert expect in str(err), err
        else:
            raise AssertionError('device=cuda did not raise')
        "
    - name: Licence gate
      run: |
        py=.venv-gate/bin/python; [ -x "$py" ] || py=.venv-gate/Scripts/python.exe
        "$py" -I tools/licence_gate.py --wheel dist/*.whl
