name: Docs
# Builds the site strictly on every pull request (HTML uploaded as an artifact)
# and deploys it to GitHub Pages on every push to main. Nothing is executed:
# the tutorials' outputs and the front-page hero data are committed
# (`just notebooks`, `just front-page-data`); ci.yml's tutorials job still runs
# the notebooks end to end.
# One-time setting: Settings -> Pages -> Source: GitHub Actions, and restrict the
# github-pages environment's deployment branches to main.
on:
  pull_request:
  push:
    branches:
    - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # never cancel a Pages deployment half way
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  UV_VERSION: "0.13.1"
jobs:
  build:
    name: build the site (ubuntu, py3.13)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
      with:
        version: ${{ env.UV_VERSION }}
        python-version: "3.13"
        enable-cache: true
    - name: Install
      # gfem itself plus the dev group (the Capabilities generator imports the
      # tests), the notebook runtime (docs) and the Sphinx stack (site, 3.13+).
      run: uv sync --locked --python 3.13 --group docs --group site
    - name: Sphinx (strict)
      env:
        GFEM_DOCS_STRICT: "1"  # the committed hero data must be there
      run: uv run --no-sync sphinx-build -n -W --keep-going docs docs/_build/html
    - name: Pagefind index
      run: uv run --no-sync python -m pagefind --site docs/_build/html
    - name: Upload the HTML for review
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
      with:
        name: docs-html
        path: docs/_build/html/
        retention-days: 7
    - name: Upload the Pages artifact
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b  # v4
      with:
        path: docs/_build/html/

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write  # publish the Pages artifact
      id-token: write  # deploy-pages proves the deployment's origin with OIDC
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy
      id: deployment
      uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
